# 列や行を失うD1変更だけを、承認manifestつきで手動実行する。
# 追加だけのmigrationはDeployが自動適用するので、通常このworkflowは使わない。
name: Migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 本番DBを変更します。実行するにはAPPLYと入力してください
        required: true
        type: string
      approved_manifest:
        description: 承認済みpending manifestのJSON（secretや明細を含めない）
        required: true
        type: string

permissions:
  contents: read

# Deployの自動適用と同じ群に入れ、本番D1への書き換えが重ならないようにする。
concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 確認文字列を検証
        if: ${{ inputs.confirm != 'APPLY' }}
        run: echo "::error::confirmへAPPLYと入力してください" && exit 1
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: 本番設定を検証
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::productionのCLOUDFLARE_API_TOKENが未登録です"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::productionのCLOUDFLARE_ACCOUNT_IDが未登録です"; exit 1; }
      - name: 承認manifestと現在のpendingを再照合
        env:
          APPROVED_MIGRATION_MANIFEST_JSON: ${{ inputs.approved_manifest }}
        run: node .github/scripts/verify-approved-migration-manifest.mjs
      - name: Time Travelの復元地点を確認
        run: pnpm run db:checkpoint
      - name: D1 migrationを適用
        run: pnpm run db:migrate:remote
