# 本番D1の形を変更する操作は、mainへのpushと分離して手動実行する。
name: Migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 本番DBを変更します。実行するにはAPPLYと入力してください
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 確認文字列を検証
        if: ${{ inputs.confirm != 'APPLY' }}
        run: echo "::error::confirmへAPPLYと入力してください" && exit 1
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: 本番設定を検証
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::productionのCLOUDFLARE_API_TOKENが未登録です"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::productionのCLOUDFLARE_ACCOUNT_IDが未登録です"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Time Travelの復元地点を確認
        run: pnpm run db:checkpoint
      - name: D1 migrationを適用
        run: pnpm run db:migrate:remote
