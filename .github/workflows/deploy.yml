# mainのCI成功後だけ本番へ公開する。D1 migrationはmigrate.ymlへ分離する。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-pnpm
      - name: 本番設定を検証
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::productionのCLOUDFLARE_API_TOKENが未登録です"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::productionのCLOUDFLARE_ACCOUNT_IDが未登録です"; exit 1; }
          test -n "$APP_URL" || { echo "::error::Repository VariableのAPP_URLが未登録です"; exit 1; }
      - name: Env型を生成
        run: pnpm --filter @kanjo/api exec wrangler types
      - name: Lint（手動実行時）
        if: github.event_name == 'workflow_dispatch'
        run: pnpm lint
      - name: 型チェック（手動実行時）
        if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck
      - name: テスト（手動実行時）
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test
      - name: D1 migrationの未適用を検査
        run: node .github/scripts/check-d1-migrations.mjs
      - name: Webをビルド
        run: pnpm --filter @kanjo/web build
      - name: Workerをデプロイ
        run: pnpm --filter @kanjo/api exec wrangler deploy
      - name: 反映待ち後の1回目確認
        run: sleep 30 && pnpm run smoke
      - name: 旧実行環境の終了待ち後の2回目確認
        run: sleep 90 && pnpm run smoke
