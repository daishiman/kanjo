# mainのCI成功後だけ本番へ公開する。
# D1 migrationはここで自動適用する。列や行を失う変更は .github/migration-approvals.json で
# PRの中で承認させ（未承認はpnpm lintで落ちる）、mergeを承認として扱う。
# 手動のmigrate.ymlへ倒すのはR2の残件確認が要る0040だけ。
# 本番へ届かなかったときは「本番に反映されていません」Issueを開き、届いたら閉じる。
# 適用は必ずWorker配信より前に行う（schema-guardが期待版へ達するまで全D1経路を503で閉じるため）。
name: Deploy

# workflow_run起動のrunは既定でworkflow名しか出ず、どのマージの配信か一覧から追えない。
# 一覧で自分のマージと結び付けられるよう、起動元のコミット表題を名前に出す。
run-name: >-
  Deploy ${{ github.event_name == 'workflow_run'
  && github.event.workflow_run.display_title
  || format('手動実行 ({0})', github.sha) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# DeployもMigrateも本番D1を書き換えうるので、同じ群で直列化する。
concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-pnpm
      - name: 本番設定を検証
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::productionのCLOUDFLARE_API_TOKENが未登録です"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::productionのCLOUDFLARE_ACCOUNT_IDが未登録です"; exit 1; }
          test -n "$APP_URL" || { echo "::error::Repository VariableのAPP_URLが未登録です"; exit 1; }
      - name: Lint（手動実行時）
        if: github.event_name == 'workflow_dispatch'
        run: pnpm lint
      - name: 型チェック（手動実行時）
        if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck
      - name: テスト（手動実行時）
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test
      # buildは本番を一切触らないので、不可逆なmigration適用より前に置く。
      # 逆順にすると、buildが落ちたとき「D1だけ新しくWorkerは旧版」という
      # 誰にも見えない不一致が本番に残る（2026-08-31 run 33354126817 で実際に発生した）。
      # wranglerがdist/を読むので、Workerデプロイより前であることは変えられない。
      #
      # build:artifactにはJS予算検査が入らない。予算は「意図しない依存流入」の回帰検知で、
      # 超過しても本番は正しく動く。可逆な品質閾値で不可逆なmigrationを含む配信を
      # 止めると、mainに入った変更が無言で本番に出ないままになる。予算はCIのpnpm build
      # （PRゲート）で守り、ここは出すことだけをする。
      - name: Webをビルド
        run: pnpm --filter @kanjo/web build:artifact
      - name: 自動適用してよいD1 migrationか判定
        id: migration_plan
        run: node .github/scripts/plan-auto-migration.mjs
      - name: Time Travelの復元地点を記録
        if: steps.migration_plan.outputs.decision == 'apply'
        run: pnpm run db:checkpoint
      - name: D1 migrationを適用
        if: steps.migration_plan.outputs.decision == 'apply'
        run: pnpm run db:migrate:remote
      - name: D1 migrationの未適用を検査
        run: node .github/scripts/check-d1-migrations.mjs
      - name: Workerをデプロイ
        run: pnpm --filter @kanjo/api exec wrangler deploy
      - name: 反映待ち後の1回目確認
        run: sleep 30 && pnpm run smoke
      - name: 旧実行環境の終了待ち後の2回目確認
        run: sleep 90 && pnpm run smoke

  # 本番へ届いたかを、Actionsの一覧を見に行かなくても分かるようにする。
  # 届かなければIssueに残して通知し、次に届いた配信がそのIssueを閉じる。
  report:
    needs: deploy
    if: >-
      always() && (
        needs.deploy.result != 'skipped' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion != 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      COMMIT_TITLE: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || '手動実行' }}
    steps:
      - name: 本番への反映結果をIssueへ記録
        run: |
          issue_title='本番に反映されていません'
          open_issue=$(gh issue list --state open --search "in:title \"$issue_title\"" --json number,title \
            --jq "map(select(.title == \"$issue_title\"))[0].number // empty")
          short_sha="${HEAD_SHA:0:7}"
          if [ "$RESULT" = "success" ]; then
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --comment "✅ ${short_sha}（${COMMIT_TITLE}）が本番へ反映されました: $RUN_URL"
            fi
            exit 0
          fi
          if [ "$RESULT" = "skipped" ]; then
            reason='main の CI が成功しなかったため Deploy が走っていません。CI を再実行するか直して merge してください。'
          else
            reason="Deploy が ${RESULT} で終わりました。D1 migration の承認不足なら、ログの ::error:: に対象ファイルが出ています。"
          fi
          body="${reason}

          - コミット: ${short_sha}（${COMMIT_TITLE}）
          - 実行: ${RUN_URL}

          この Issue が閉じるまで本番は古いままです。直して merge すれば、次の Deploy が本番へ届いた時点で自動で閉じます。"
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh issue create --title "$issue_title" --body "$body"
          fi
