# PRとmainの品質ゲート。外部環境を変更する処理は置かない。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Deployのbuildが落ちると、本番D1だけが先に進んだ状態が残る。
      # 同じbuildをここで通し、壊れたものがmainへ入らないようにする。
      # webのJS予算超過もWorkerのバンドル失敗も、この1本で先に捕まえる。
      - name: ビルドできることを確認
        run: pnpm build
      - name: 依存関係の脆弱性を確認
        run: pnpm audit --prod --audit-level high || echo "::warning::high以上の既知脆弱性があります。詳細はログを確認してください。"
